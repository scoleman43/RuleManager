services:
  postgres:
    image: postgres:16-alpine
    container_name: rulemanager-postgres
    environment:
      POSTGRES_DB: rulemanager
      POSTGRES_USER: rulemanager
      POSTGRES_PASSWORD: rulemanager_dev
    ports:
      - "5432:5432"
    volumes:
      - rulemanager-postgres-data:/var/lib/postgresql/data

volumes:
  rulemanager-postgres-data:
